<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مهام الطالب - Student Tasks</title>
    <!-- خط توبولي عهدي ونظيف -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0a84ff;
            --primary-glow: rgba(10, 132, 255, 0.4);
            --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1f242d 100%);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.2);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --card-radius: 28px;
            --inner-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* خلفية ليكويد جمالية متحركة */
        .liquid-blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: -1;
            animation: floatBlob 10s infinite alternate ease-in-out;
        }
        .blob-1 { top: -50px; right: -50px; }
        .blob-2 { bottom: -50px; left: -50px; background: #30d158; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* الهيدر بتصميم iOS 26 Liquid Glass */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 1px 0 var(--glass-shine);
        }

        .logo-area h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: inset 0 1px 0 var(--glass-shine);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* شريط التبويبات الفخم */
        .tabs {
            display: flex;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 0 var(--glass-shine);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        /* أقسام المحتوى */
        .section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الكروت الزجاجية (Liquid Glass Cards) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 1px 0 var(--glass-shine);
        }

        .glass-card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glass-card h3 i {
            color: var(--primary);
        }

        /* النماذج والإدخال */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: var(--inner-radius);
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* اختيار الأيام المتعددة */
        .days-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .day-checkbox {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 8px 4px;
            text-align: center;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .day-checkbox input {
            display: none;
        }

        .day-checkbox.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* الأزرار العصرية */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #0056b3);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: var(--inner-radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--primary-glow);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* قائمة العناصر والمواد */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--inner-radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        /* تنسيق المهمة المنجزة */
        .list-item.completed {
            background: rgba(48, 209, 88, 0.08);
            border-color: rgba(48, 209, 88, 0.3);
        }

        .list-item.completed h4, 
        .list-item.completed p {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-info h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff3b30;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:active {
            transform: scale(0.9);
        }

        .done-btn {
            background: rgba(48, 209, 88, 0.15);
            border: 1px solid rgba(48, 209, 88, 0.3);
            color: #30d158;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .done-btn:active {
            transform: scale(0.9);
        }

        /* نافذة الإعدادات (Modal) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.open {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .color-option {
            height: 45px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .color-option.selected {
            border-color: #fff;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>

    <div class="container">
        <!-- الهيدر -->
        <header>
            <div class="logo-area">
                <h1>مهام الطالب</h1>
                <p>تنظيم ذكي • ليكويد جلاس</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="requestNotificationPermission()" title="تفعيل الإشعارات"><i class="fa-solid fa-bell"></i></button>
                <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-palette"></i></button>
            </div>
        </header>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tasks')">المهام اليومية</button>
            <button class="tab-btn" onclick="switchTab('subjects')">جدول المواد</button>
        </div>

        <!-- قسم المهام الرئيسية -->
        <div id="tasks-section" class="section active">
            <div class="glass-card">
                <h3><i class="fa-solid fa-plus-circle"></i> إضافة مهمة أو مطلوب جديد</h3>
                <form id="task-form" onsubmit="addaTask(event)">
                    <div class="form-group">
                        <label>اختر المادة الدراسية</label>
                        <select id="task-subject" required>
                            <option value="" disabled selected>اختر المادة من جدولك...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اليوم</label>
                        <select id="task-day" required>
                            <option value="السبت">السبت</option>
                            <option value="الأحد">الأحد</option>
                            <option value="الإثنين">الإثنين</option>
                            <option value="الثلاثاء">الثلاثاء</option>
                            <option value="الأربعاء">الأربعاء</option>
                            <option value="الخميس">الخميس</option>
                            <option value="الجمعة">الجمعة</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>التسميع أو الحفظ المطلوب</label>
                        <textarea id="task-memorize" rows="2" placeholder="اكتب المطلوب حفظه أو تسميعه..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>الواجب المدرسي / التمارين</label>
                        <textarea id="task-homework" rows="2" placeholder="اكتب الواجب أو التمارين..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-check"></i> حفظ المهمة</button>
                </form>
            </div>

            <div class="glass-card">
                <h3><i class="fa-solid fa-list-check"></i> قائمة المهام الحالية</h3>
                <div id="tasks-list" class="item-list">
                    <div class="empty-state">لا توجد مهام مضافة حالياً. ابدأ بإضافة مهمة جديدة!</div>
                </div>
            </div>
        </div>

        <!-- قسم جدول المواد -->
        <div id="subjects-section" class="section">
            <div class="glass-card">
                <h3><i class="fa-solid fa-book-bookmark"></i> إضافة مادة لجدولك</h3>
                <form id="subject-form" onsubmit="addSubject(event)">
                    <div class="form-group">
                        <label>اسم المادة</label>
                        <input type="text" id="sub-name" placeholder="مثال: كيمياء، فيزياء، تفاضل..." required>
                    </div>
                    <div class="form-group">
                        <label>وقت الحصة / الدرس</label>
                        <input type="time" id="sub-time" required>
                    </div>
                    <div class="form-group">
                        <label>أيام الأسبوع (اختر يوم أو أكتر للمادة)</label>
                        <div class="days-selector">
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="السبت"> السبت</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الأحد"> الأحد</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الإثنين"> الإثنين</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الثلاثاء"> الثلاثاء</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الأربعاء"> الأربعاء</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الخميس"> الخميس</label>
                            <label class="day-checkbox"><input type="checkbox" name="sub-days" value="الجمعة"> الجمعة</label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-plus"></i> إضافة للمواد</button>
                </form>
            </div>

            <div class="glass-card">
                <h3><i class="fa-solid fa-calendar-days"></i> مواد جدولك الدراسية</h3>
                <div id="subjects-list" class="item-list">
                    <div class="empty-state">لم تقم بإضافة مواد دراسية بعد.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات والألوان -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>تخصيص ألوان التطبيق</h3>
                <button class="icon-btn" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 0.850rem; color: var(--text-muted); margin-bottom: 15px;">اختر اللون المفضل ليتناسب مع ذوقك:</p>
            <div class="color-picker-grid">
                <div class="color-option" style="background: #0a84ff;" onclick="changeTheme('#0a84ff', 'rgba(10, 132, 255, 0.4)')"></div>
                <div class="color-option" style="background: #30d158;" onclick="changeTheme('#30d158', 'rgba(48, 209, 88, 0.4)')"></div>
                <div class="color-option" style="background: #bf5af2;" onclick="changeTheme('#bf5af2', 'rgba(191, 90, 242, 0.4)')"></div>
                <div class="color-option" style="background: #ff9f0a;" onclick="changeTheme('#ff9f0a', 'rgba(255, 159, 10, 0.4)')"></div>
            </div>
            <button class="btn-primary" onclick="closeSettings()">تم الحفظ</button>
        </div>
    </div>

    <script>
        // إدارة البيانات في الذاكرة المحلية
        let subjects = JSON.parse(localStorage.getItem('student_subjects')) || [];
        let tasks = JSON.parse(localStorage.getItem('student_tasks')) || [];

        // تفعيل اختيار الأيام بالتصميم
        document.querySelectorAll('.day-checkbox').forEach(label => {
            label.addEventListener('click', function() {
                const box = this.querySelector('input');
                box.checked = !box.checked;
                this.classList.toggle('selected', box.checked);
            });
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if(tabId === 'tasks') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tasks-section').classList.add('active');
                updateSubjectDropdown();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('subjects-section').classList.add('active');
            }
        }

        function addSubject(e) {
            e.preventDefault();
            const name = document.getElementById('sub-name').value;
            const time = document.getElementById('sub-time').value;
            const selectedDays = Array.from(document.querySelectorAll('input[name="sub-days"]:checked')).map(el => el.value);

            if(selectedDays.length === 0) {
                alert('الرجاء اختيار يوم واحد على الأقل للمادة!');
                return;
            }

            const newSub = { id: Date.now(), name, time, days: selectedDays };
            subjects.push(newSub);
            localStorage.setItem('student_subjects', JSON.stringify(subjects));
            
            document.getElementById('subject-form').reset();
            document.querySelectorAll('.day-checkbox').forEach(el => el.classList.remove('selected'));
            renderSubjects();
            updateSubjectDropdown();
            alert('تم إضافة المادة بنجاح!');
        }

        function renderSubjects() {
            const list = document.getElementById('subjects-list');
            if(subjects.length === 0) {
                list.innerHTML = `<div class="empty-state">لم تقم بإضافة مواد دراسية بعد.</div>`;
                return;
            }
            list.innerHTML = subjects.map(sub => `
                <div class="list-item">
                    <div class="item-info">
                        <h4>${sub.name}</h4>
                        <p><i class="fa-regular fa-clock"></i> ${sub.time} | <i class="fa-regular fa-calendar"></i> ${sub.days.join(', ')}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteSubject(${sub.id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function deleteSubject(id) {
            subjects = subjects.filter(s => s.id !== id);
            localStorage.setItem('student_subjects', JSON.stringify(subjects));
            renderSubjects();
            updateSubjectDropdown();
        }

        function updateSubjectDropdown() {
            const select = document.getElementById('task-subject');
            if(subjects.length === 0) {
                select.innerHTML = `<option value="" disabled selected>أضف مواد في جدولك أولاً...</option>`;
                return;
            }
            select.innerHTML = `<option value="" disabled selected>اختر المادة...</option>` + 
                subjects.map(s => `<option value="${s.name}">${s.name} (${s.days.join(', ')})</option>`).join('');
        }

        function addaTask(e) {
            e.preventDefault();
            const subject = document.getElementById('task-subject').value;
            const day = document.getElementById('task-day').value;
            const memorize = document.getElementById('task-memorize').value;
            const homework = document.getElementById('task-homework').value;

            // أضفنا خاصية completed لحفظ حالة الإنجاز
            const newTask = { id: Date.now(), subject, day, memorize, homework, completed: false };
            tasks.push(newTask);
            localStorage.setItem('student_tasks', JSON.stringify(tasks));

            document.getElementById('task-form').reset();
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    t.completed = !t.completed;
                }
                return t;
            });
            localStorage.setItem('student_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            if(tasks.length === 0) {
                list.innerHTML = `<div class="empty-state">لا توجد مهام مضافة حالياً. ابدأ بإضافة مهمة جديدة!</div>`;
                return;
            }
            list.innerHTML = tasks.map(t => `
                <div class="list-item ${t.completed ? 'completed' : ''}" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                    <div style="display: flex; width: 100%; justify-content: space-between; align-items: center;">
                        <h4 style="color: var(--primary);">${t.subject} (${t.day})</h4>
                        <div class="item-actions">
                            <button class="done-btn" onclick="toggleTask(${t.id})" title="${t.completed ? 'إلغاء الإنجاز' : 'تم الإنجاز'}">
                                <i class="fa-solid ${t.completed ? 'fa-rotate-left' : 'fa-check'}"></i>
                            </button>
                            <button class="delete-btn" onclick="deleteTask(${t.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    ${t.memorize ? `<p><strong>الحفظ/التسميع:</strong> ${t.memorize}</p>` : ''}
                    ${t.homework ? `<p><strong>الواجب:</strong> ${t.homework}</p>` : ''}
                </div>
            `).join('');
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('student_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // نظام التنبيهات الحقيقية وتغيير الألوان
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("متصفحك لا يدعم الإشعارات.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("تم تفعيل الإشعارات بنجاح! سيتم تنبيهك بالليل، قبل الميعاد بساعة، وبملخص جدول بكرة.");
                    new Notification("تطبيق مهام الطالب", { body: "تم تفعيل نظام التنبيهات بنجاح وجاهز لمساعدتك!" });
                } else {
                    alert("تم رفض إذن الإذن. يرجى تفعيلها من إعدادات المتصفح.");
                }
            });
        }

        function openSettings() { document.getElementById('settings-modal').classList.add('open'); }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

        function changeTheme(color, glow) {
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--primary-glow', glow);
            localStorage.setItem('app_theme_color', color);
            localStorage.setItem('app_theme_glow', glow);
        }

        // استرجاع الإعدادات عند الفتح
        window.onload = function() {
            const savedColor = localStorage.getItem('app_theme_color');
            const savedGlow = localStorage.getItem('app_theme_glow');
            if(savedColor) {
                document.documentElement.style.setProperty('--primary', savedColor);
                document.documentElement.style.setProperty('--primary-glow', savedGlow);
            }
            renderSubjects();
            renderTasks();
            updateSubjectDropdown();
        }
    </script>
</body>
</html>
